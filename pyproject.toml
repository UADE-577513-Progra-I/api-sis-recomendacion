[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "recomendador"
version = "0.1.0"
description = "Sistema de Recomendación Musical — Programación I, UADE"
requires-python = ">=3.10"
dependencies = ["flask>=3.0"]

[project.scripts]
recomendador = "recomendador.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
recomendador = ["static/*"]
